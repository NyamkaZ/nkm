<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ нэвтрэх</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
    }
    .login-container {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #333;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .login-container h1 {
      text-align: center;
      margin: 0 0 30px;
      color: #fff;
      font-size: 1.6em;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      color: #aaa;
      margin-bottom: 6px;
      font-size: 0.9em;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s;
      margin-top: 6px;
    }
    .login-btn:hover { background: #2b7de9; }
    .login-btn:disabled { background: #555; cursor: not-allowed; }
    .error-msg {
      background: #5c1f1f;
      color: #ffaaaa;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 0.9em;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 Админ нэвтрэх</h1>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
      <label>Хэрэглэгчийн нэр</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Нууц үг</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="login-btn" id="loginBtn" onclick="login()">Нэвтрэх</button>
  </div>

  <script src="js/config.js"></script>
  <script>
    // If already logged in, redirect
    fetch(`${API_BASE}/api/auth/check`, { credentials: 'include' })
      .then(r => r.json())
      .then(d => { if (d.loggedIn) location.href = 'admin_dashboard.html'; })
      .catch(() => {});

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      if (!username || !password) {
        showError('Хэрэглэгчийн нэр болон нууц үгээ оруулна уу');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Түр хүлээнэ үү...';
      err.classList.remove('show');

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          location.href = 'admin_dashboard.html';
        } else {
          showError(data.error || 'Нэвтрэх амжилтгүй');
        }
      } catch (e) {
        showError('Сервертэй холбогдоход алдаа гарлаа');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Нэвтрэх';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }
  </script>
</body>
</html>
